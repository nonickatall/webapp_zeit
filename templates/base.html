<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeiterfassung — {% block titel %}Verwaltung{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='zeit.css') }}">
<script src="{{ url_for('static', filename='zeit.js') }}" defer></script>
</head>
<body {% if not oeffentlich %}data-leerlauf-sek="{{ config_leerlauf }}"{% endif %}>
{% if not oeffentlich and g.mu %}
<nav class="reiter">
    <span class="marke-app">Zeiterfassung</span>
    <a href="{{ url_for('anwesenheit') }}" class="{{ 'active' if seite == 'anwesenheit' }}">Anwesenheit</a>
    <a href="{{ url_for('datensaetze') }}" class="{{ 'active' if seite == 'datensaetze' }}">Datensätze</a>
    <a href="{{ url_for('offen') }}" class="{{ 'active' if seite == 'offen' }}">Offene Fälle</a>
    <a href="{{ url_for('zeitregeln') }}" class="{{ 'active' if seite == 'zeitregeln' }}">Zeitregeln</a>
    <a href="{{ url_for('summen') }}" class="{{ 'active' if seite == 'summen' }}">Monatssummen</a>
    <span class="rechts">
        <span>{{ g.mu.name }}</span>
        <form method="post" action="{{ url_for('abmelden') }}"><button type="submit">Abmelden</button></form>
    </span>
</nav>
{% endif %}
<div class="page">
    {% block seitenkopf %}
    <h1 class="page-title">
        <span>{{ self.titel() }}</span>
        {% if hilfe %}<button type="button" class="titel-hilfe" id="hilfe-knopf" data-hilfe="{{ hilfe }}" title="Hilfe zu dieser Seite">H</button>{% endif %}
    </h1>
    {% endblock %}
    {% block inhalt %}{% endblock %}
</div>
<div id="hilfe-overlay" hidden></div>
<div id="hilfe-fenster" hidden>
    <div class="hilfe-kopf"><span id="hilfe-titel">Hilfe</span><button type="button" id="hilfe-zu" title="Schließen (Esc)">✕</button></div>
    <div id="hilfe-inhalt"></div>
</div>
</body>
</html>
